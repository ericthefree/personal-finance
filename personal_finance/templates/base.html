<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Personal Finance{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('main.summary') }}">
      <span class="brand-mark">PF</span>
      <span>Personal Finance</span>
    </a>
    <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">☰</button>
    <nav aria-label="Primary navigation">
      <a href="{{ url_for('main.summary') }}" class="{{ 'active' if request.endpoint == 'main.summary' }}">Summary</a>
      <a href="{{ url_for('main.transactions') }}" class="{{ 'active' if request.endpoint == 'main.transactions' }}">Transactions</a>
      <a href="{{ url_for('main.budget') }}" class="{{ 'active' if request.endpoint == 'main.budget' }}">Budget</a>
      <a href="{{ url_for('main.admin') }}" class="{{ 'active' if request.endpoint in ['main.admin', 'main.import_preview'] }}">Admin</a>
    </nav>
  </header>
  <main class="page-shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert {{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
